name: Fetch Entra & Purview Updates

on:
  schedule:
    - cron: "0 6 * * *"   # Daily at 6:00 AM UTC
  workflow_dispatch:        # Allows manual "Run workflow" button for testing

permissions:
  contents: write           # Required so the workflow can commit the cache file

jobs:
  fetch-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch and categorize updates
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/fetch-updates.js

      - name: Commit updated cache (triggers Vercel deploy)
        run: |
          git config user.name "secrole-bot"
          git config user.email "actions@github.com"
          git add public/updates-cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh updates cache [skip ci]"
            git push
          fi
